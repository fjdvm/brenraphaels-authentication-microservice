name: Portal container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify PR changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          classification=code
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            # Include both sides of renames and deleted files; preserve unusual filenames.
            git diff --name-only --no-renames -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            mapfile -d '' -t changed_paths < "$RUNNER_TEMP/changed-paths"
            classification=$(node scripts/ci/classify-changes.mjs "${changed_paths[@]}")
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "Change classification: $classification" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    if: needs.changes.outputs.classification == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  container-smoke:
    needs: changes
    if: needs.changes.outputs.classification == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: portal:ticket142
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record and limit uncompressed image size
        run: |
          bytes=$(docker image inspect portal:ticket142 --format '{{.Size}}')
          echo "Portal image: $bytes bytes (limit 400 MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 419430400
      - name: Resolve Playwright version
        id: playwright
        run: node -e "console.log('version=' + require('@playwright/test/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      # OS packages are not part of the browser cache and are needed on every runner.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Smoke test against disposable PostgreSQL
        run: bash scripts/container-smoke/run.sh

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, checks, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLASSIFICATION: ${{ needs.changes.outputs.classification }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$CLASSIFICATION" in
            docs-only)
              test "$CHECKS_RESULT" = skipped
              test "$CONTAINER_RESULT" = skipped
              ;;
            code)
              test "$CHECKS_RESULT" = success
              test "$CONTAINER_RESULT" = success
              ;;
            *) exit 1 ;;
          esac

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: portal-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RESOURCE_GROUP: rg-brenraphaels
      CONTAINER_APP: portal
      PORTAL_PUBLIC_URL: https://portal.buildwrite.me
      PORTAL_CUSTOM_DOMAIN: portal.buildwrite.me
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=portal-production
          cache-to: type=gha,mode=max,scope=portal-production
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify Portal revision
        shell: bash
        env:
          DEPLOY_SECRETS: ${{ toJSON(secrets) }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          PORTAL_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          export AZURE_CORE_ONLY_SHOW_ERRORS=true
          export CONTAINER_ENVIRONMENT_ID
          CONTAINER_ENVIRONMENT_ID=$(az containerapp env show -g "$RESOURCE_GROUP" -n cae-brenraphaels --query id -o tsv)
          # The manifest replaces the whole app config, so it must carry the custom
          # domain binding; reuse the existing managed certificate (never create one here).
          export PORTAL_CERTIFICATE_ID
          PORTAL_CERTIFICATE_ID=$(az containerapp env certificate list -g "$RESOURCE_GROUP" -n cae-brenraphaels \
            --query "[?properties.subjectName=='$PORTAL_CUSTOM_DOMAIN' && properties.provisioningState=='Succeeded'].id | [0]" -o tsv)
          if [ -z "$PORTAL_CERTIFICATE_ID" ] || [ "$PORTAL_CERTIFICATE_ID" = None ]; then
            echo "::error::No succeeded managed certificate for $PORTAL_CUSTOM_DOMAIN in cae-brenraphaels"
            exit 1
          fi
          export REVISION_SUFFIX="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          manifest="$RUNNER_TEMP/portal-deploy.json"
          trap 'rm -f "$manifest"' EXIT
          python3 scripts/deploy/render-container-app.py "$manifest"
          # Suppress the ARM response: it can contain configuration/secret fields.
          az containerapp create -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --yaml "$manifest" --output none
          revision="$CONTAINER_APP--$REVISION_SUFFIX"
          ready=false
          for attempt in $(seq 1 60); do
            state=$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --revision "$revision" --query properties.healthState -o tsv)
            if [ "$state" = Healthy ]; then ready=true; break; fi
            sleep 10
          done
          test "$ready" = true
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)
          latest=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.latestReadyRevisionName -o tsv)
          test "$latest" = "$revision"
          curl --fail --silent --show-error --retry 6 --retry-all-errors "https://$fqdn/api/health"
          bound=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --query "properties.configuration.ingress.customDomains[?name=='$PORTAL_CUSTOM_DOMAIN' && bindingType=='SniEnabled'] | length(@)" -o tsv)
          if [ "$bound" != 1 ]; then
            echo "::error::$PORTAL_CUSTOM_DOMAIN is not bound (SniEnabled) to $CONTAINER_APP after the deploy"
            exit 1
          fi
          curl --fail --silent --show-error --retry 6 --retry-all-errors "https://$PORTAL_CUSTOM_DOMAIN/api/health"
          {
            echo '### Portal deployment'
            echo "- Default address: https://$fqdn"
            echo "- Healthy revision: $revision"
            echo "- Image: $PORTAL_IMAGE"
            echo '- Replicas: min 1, max 2; 0.5 vCPU / 1 GiB'
            echo '- Previous revisions retained inactive for rollback (up to 10).'
          } >> "$GITHUB_STEP_SUMMARY"
